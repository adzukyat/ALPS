name: Release

# Bumping "version" in package.json on main publishes a GitHub Release tagged
# v<version> with a .unitypackage attached. A version that already has a tag
# is left alone, so other edits to package.json do not release again.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A manual run from another branch would tag that branch, so only main releases.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists, nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package metadata
        if: steps.version.outputs.exists == 'false'
        run: bash scripts/check-package-metadata.sh

      - name: Build unitypackage
        if: steps.version.outputs.exists == 'false'
        run: python3 .github/scripts/build-unitypackage.py --output "dist/ALPS-${{ steps.version.outputs.version }}.unitypackage"

      # The notes are the CHANGELOG.md section headed "## [<version>]" (or
      # "## <version>"), up to the next "## " heading. Without one they are empty.
      - name: Read release notes
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          heading = re.compile(rf"^##\s+\[?v?{re.escape(version)}\]?(\s|$)")
          lines, inside = [], False
          changelog = Path("CHANGELOG.md")
          if changelog.is_file():
              for line in changelog.read_text(encoding="utf-8").splitlines():
                  if line.startswith("## "):
                      if inside:
                          break
                      inside = bool(heading.match(line))
                  elif inside:
                      lines.append(line)
          notes = "\n".join(lines).strip()
          if not notes:
              print(f"::warning::CHANGELOG.md has no section for {version}, the release notes are empty.")
          Path("dist/notes.md").write_text(notes + "\n", encoding="utf-8")
          EOF

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/ALPS-${VERSION}.unitypackage" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file dist/notes.md
